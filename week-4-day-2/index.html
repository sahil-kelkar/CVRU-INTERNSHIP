<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 - Day 2: React ThemeContext (Light / Dark Mode)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; padding: 0;">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, createContext, useContext } = React;

    // Task 1: Create ThemeContext
    const ThemeContext = createContext();

    // Task 2: Navbar with Toggle Button
    function Navbar() {
      const { theme, setTheme } = useContext(ThemeContext);

      const toggleTheme = () => {
        setTheme(theme === "light" ? "dark" : "light");
      };

      return (
        <nav style={{
          padding: "15px 20px",
          backgroundColor: theme === "light" ? "#e2e8f0" : "#1e293b",
          color: theme === "light" ? "#000000" : "#ffffff",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center"
        }}>
          <h2 style={{ margin: 0 }}>My Theme App</h2>
          <button 
            onClick={toggleTheme}
            style={{
              padding: "8px 16px",
              fontSize: "14px",
              cursor: "pointer",
              borderRadius: "6px",
              border: "1px solid #ccc"
            }}
          >
            Switch to {theme === "light" ? "Dark 🌙" : "Light ☀️"}
          </button>
        </nav>
      );
    }

    // Main App Component
    function App() {
      const [theme, setTheme] = useState("light");

      const appStyle = {
        backgroundColor: theme === "light" ? "#ffffff" : "#0f172a",
        color: theme === "light" ? "#000000" : "#ffffff",
        minHeight: "100vh",
        textAlign: "center",
        fontFamily: "Arial, sans-serif"
      };

      return (
        <ThemeContext.Provider value={{ theme, setTheme }}>
          <div style={appStyle}>
            <Navbar />
            <div style={{ marginTop: "60px" }}>
              <h1>Current Theme: {theme.toUpperCase()}</h1>
              <p>Click the button in the Navbar to toggle the theme globally!</p>
            </div>
          </div>
        </ThemeContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
