<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 3 - Day 4: Fetch API Data with useEffect</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9;">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Task 1: UserList Component
    function UserList() {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            if (!res.ok) throw new Error("Failed to fetch data");
            return res.json();
          })
          .then((data) => {
            setUsers(data);
          })
          .catch((err) => {
            setError(err.message);
          })
          .finally(() => setLoading(false));
      }, []);

      const cardStyle = {
        border: "1px solid #ddd",
        backgroundColor: "#ffffff",
        margin: "10px 0",
        padding: "12px",
        borderRadius: "5px",
      };

      if (loading) return <h2>Loading...</h2>;
      if (error) return <h2 style={{ color: "red" }}>{error}</h2>;

      return (
        <div>
          <h2>User List</h2>
          {users.map((user) => (
            <div key={user.id} style={cardStyle}>
              <h3 style={{ margin: "0 0 5px 0" }}>{user.name}</h3>
              <p style={{ margin: "2px 0" }}>Email: {user.email}</p>
              <p style={{ margin: "2px 0" }}>City: {user.address?.city}</p>
            </div>
          ))}
        </div>
      );
    }

    // Task 2: Posts Component
    function Posts() {
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      useEffect(() => {
        async function fetchPosts() {
          try {
            const res = await fetch("https://jsonplaceholder.typicode.com/posts");
            if (!res.ok) throw new Error("Failed to fetch posts");
            const data = await res.json();
            setPosts(data.slice(0, 10)); // show only 10
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }

        fetchPosts();
      }, []);

      const box = {
        padding: "12px",
        backgroundColor: "#ffffff",
        border: "1px solid #ccc",
        marginBottom: "10px",
        borderRadius: "5px",
      };

      if (loading) return <h2>Fetching data...</h2>;
      if (error) return <h2 style={{ color: "red" }}>{error}</h2>;

      return (
        <div>
          <h2>Posts</h2>
          {posts.map((p) => (
            <div key={p.id} style={box}>
              <h3 style={{ margin: "0 0 5px 0" }}>{p.title}</h3>
              <p style={{ margin: "2px 0" }}>{p.body}</p>
            </div>
          ))}
        </div>
      );
    }

    // Main App
    function App() {
      return (
        <div style={{ maxWidth: "600px", margin: "0 auto" }}>
          <UserList />
          <hr style={{ margin: "30px 0" }} />
          <Posts />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
