<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 - Day 3: Tailwind CSS in React</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Task 2: Responsive Navigation Bar
    function Navbar() {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <nav className="bg-gray-900 text-white p-4">
          <div className="flex items-center justify-between max-w-6xl mx-auto">
            <h1 className="text-xl font-bold">MySite</h1>

            {/* Desktop Links */}
            <ul className="hidden md:flex gap-6">
              <li className="cursor-pointer hover:text-blue-400">Home</li>
              <li className="cursor-pointer hover:text-blue-400">About</li>
              <li className="cursor-pointer hover:text-blue-400">Contact</li>
            </ul>

            {/* Mobile Button */}
            <button 
              className="md:hidden text-2xl focus:outline-none" 
              onClick={() => setIsOpen(!isOpen)}
            >
              ☰
            </button>
          </div>

          {/* Mobile Dropdown */}
          {isOpen && (
            <ul className="md:hidden flex flex-col gap-3 mt-4 text-center border-t border-gray-700 pt-3">
              <li className="cursor-pointer hover:text-blue-400">Home</li>
              <li className="cursor-pointer hover:text-blue-400">About</li>
              <li className="cursor-pointer hover:text-blue-400">Contact</li>
            </ul>
          )}
        </nav>
      );
    }

    // Tasks 1 & 3: Card Layout & Button
    function CardList() {
      const cards = [
        {
          id: 1,
          title: "React Components",
          desc: "Learn to build reusable UI pieces with clean JSX syntax."
        },
        {
          id: 2,
          title: "Tailwind CSS",
          desc: "Style elements rapidly using modern utility classes directly in JSX."
        },
        {
          id: 3,
          title: "Responsive Design",
          desc: "Easily handle mobile, tablet, and desktop screens with grid utilities."
        }
      ];

      return (
        <div className="max-w-6xl mx-auto p-6">
          <h2 className="text-2xl font-bold text-center text-gray-800 mb-8">
            Tailwind Card Layout
          </h2>

          {/* Task 3: Responsive Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            {cards.map((card) => (
              <div
                key={card.id}
                className="p-6 shadow-md rounded-xl bg-white hover:scale-105 transition duration-200 border border-gray-100 flex flex-col justify-between"
              >
                <div>
                  <h3 className="text-lg font-semibold text-gray-800">{card.title}</h3>
                  <p className="text-gray-600 mt-2 text-sm">{card.desc}</p>
                </div>

                {/* Task 1: Button with Tailwind classes */}
                <button className="mt-6 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium text-sm self-start">
                  Click Me
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Main App
    function App() {
      return (
        <div>
          <Navbar />
          <main>
            <CardList />
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
